# OAuth2 Proxy configuration for AWS Cognito
# All secrets and environment-specific values are set via environment variables

provider = "oidc"
provider_display_name = "Cognito"

# Cookie settings
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"

# Upstream application
upstreams = ["http://whisper-webui:7860"]

# Authentication settings
skip_provider_button = true

# Pass user info to upstream
pass_access_token = true
pass_authorization_header = true
set_authorization_header = true
set_xauthrequest = true

# Session settings
session_store_type = "cookie"

# Silence ping endpoint logging
silence_ping_logging = true
